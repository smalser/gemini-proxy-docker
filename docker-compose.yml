services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      TLS_CERT: ${TLS_CERT:-/certs/cert.pem}
      TLS_KEY: ${TLS_KEY:-/certs/key.pem}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CERT_DIR:-./certs}:/certs:ro
      - caddy_data:/data
    depends_on:
      - gemini-balance

  gemini-balance:
    image: ghcr.io/snailyp/gemini-balance:${GB_VERSION:-latest}
    restart: unless-stopped
    # наружу не смотрит: снаружи доступ только через caddy
    expose:
      - "8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; exit(0) if requests.get('http://localhost:8000/health').status_code == 200 else exit(1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
