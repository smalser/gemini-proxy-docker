# Конфиг CLIProxyAPI. Скопируй в config.yaml — тот в .gitignore, потому что в нём ключи.
# Полный список опций — в config.example.yaml апстрима.

# внутри контейнера всегда 8317, наружу его отдаёт docker-compose на 228
port: 8317

# HTTPS силами самого приложения, без отдельного реверс-прокси.
# Каталог с сертификатом монтируется из CERT_DIR как /certs.
# Файлы у letsencrypt называются fullchain.pem и privkey.pem — поправь пути под свои.
# Нет сертификата — поставь enable: false, тогда будет голый http,
# и ключ из api-keys поедет по сети открытым текстом.
tls:
  enable: true
  cert: "/certs/cert.pem"
  key: "/certs/key.pem"

# каталог с OAuth-токенами аккаунтов; смонтирован из ./auths
auth-dir: "/root/.cli-proxy-api"

# ключи, которыми клиенты авторизуются у тебя; их вписывают агенты как api_key
api-keys:
  - "sk-придумай-строку"

# админский API. Пустой secret-key выключает его целиком.
remote-management:
  allow-remote: false
  secret-key: ""

# исходящий прокси до Google; поддерживает http, https и socks5.
# Пусто — запросы идут напрямую.
proxy-url: ""

# счётчик запросов и токенов в памяти, читается через management API
usage-statistics-enabled: false

debug: false
